name: Static export
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  export:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build the static export
        run: npm run export
      - name: Check that every story exported
        run: node scripts/check-export.mjs
